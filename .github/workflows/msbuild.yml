name: Build & Release

# CI builds run on branch pushes (artifacts only, no release spam);
# a release is published ONLY when a version tag like "2026.9.12-pip-dlss"
# is pushed - tag, release name and asset names are all derived from that tag,
# so they can never drift from the engine version again.
on:
  push:
    branches: [ "update-*" ]
    tags: [ "*-pip-dlss" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2026.9.12). Leave empty for a build-only run.'
        required: false
        default: ''

permissions: write-all

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: src/engine-vs2022.sln

  # Only the DX11 AVX configuration is shipped; the other seven build
  # configurations remain available locally for developers.
  BUILD_CONFIG: DX11-AVX
  PACK_GAMEDATA_NAME: 00_modded_exes_gamedata.db0

jobs:
  pack_gamedata:
    name: pack_gamedata
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Pack gamedata
      run: |
        new-item -path "./compressor/gamedata" -itemtype directory -force
        copy-item -path "./gamedata/*" -destination "./compressor/gamedata" -recurse -force
        cd ./compressor
        start-process -filepath "./! compress_gamedata.cmd" -Wait
        rename-item -path gamedata.db0 -newname ${{env.PACK_GAMEDATA_NAME}}

    - name: Upload gamedata
      uses: actions/upload-artifact@v4.6.0
      with:
        # Artifact name
        name: ${{env.PACK_GAMEDATA_NAME}}

        # A file, directory or wildcard pattern that describes what to upload
        path: ./compressor/${{env.PACK_GAMEDATA_NAME}}

        # The desired behavior if no files are found using the provided path.
        # warn: Output a warning but do not fail the action
        # error: Fail the action with an error message
        # ignore: Do not output any warnings or errors, the action does not fail
        if-no-files-found: "error"

        # Duration after which artifact will expire in days. 0 means using default retention. Minimum 1 day. Maximum 90 days unless changed from the repository settings page.
        retention-days: 1

  build_mt:
    name: build-mt-job
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        buildconf: ["DX11-AVX"]

    steps:
    - name: Configure Pagefile
      uses: al-cheb/configure-pagefile-action@v1.3
      with:
        # Set minimum size of Pagefile
        minimum-size: 8GB
        # Set maximum size of Pagefile
        maximum-size: 8GB
        # Set disk root where pagefile.sys will be located
        disk-root: "C:"

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Init submodules
      uses: snickerbockers/submodules-init@v4

    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v1.3.1
      with:
        msbuild-architecture: "x64"

    - name: Build ${{matrix.buildconf}}
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{matrix.buildconf}} ${{env.SOLUTION_FILE_PATH}}

    - name: Upload Exe
      uses: actions/upload-artifact@v4.6.0
      with:
        # Artifact name
        name: ${{matrix.buildconf}}_mt_exe

        # A file, directory or wildcard pattern that describes what to upload
        path: ./_build/_game/bin_dbg/*.exe

        # The desired behavior if no files are found using the provided path.
        # warn: Output a warning but do not fail the action
        # error: Fail the action with an error message
        # ignore: Do not output any warnings or errors, the action does not fail
        if-no-files-found: "error"

        # Duration after which artifact will expire in days. 0 means using default retention. Minimum 1 day. Maximum 90 days unless changed from the repository settings page.
        retention-days: 1

    - name: Zip PDB
      run: |
        cd ./_build/_game/bin_dbg
        compress-archive -DestinationPath "STALKER-Anomaly-modded-exes_${{matrix.buildconf}}_mt_pdb.zip" -Path "./*.pdb"

    - name: Upload PDB
      uses: actions/upload-artifact@v4.6.0
      with:
        # Artifact name
        name: ${{matrix.buildconf}}_mt_pdb

        # A file, directory or wildcard pattern that describes what to upload
        path: ./_build/_game/bin_dbg/*.zip

        # The desired behavior if no files are found using the provided path.
        # warn: Output a warning but do not fail the action
        # error: Fail the action with an error message
        # ignore: Do not output any warnings or errors, the action does not fail
        if-no-files-found: "error"

        # Duration after which artifact will expire in days. 0 means using default retention. Minimum 1 day. Maximum 90 days unless changed from the repository settings page.
        retention-days: 1

  release:
    needs: [pack_gamedata, build_mt]
    name: Release
    runs-on: ubuntu-latest
    # Only publish on a version tag push, or on a manual run with an explicit version.
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '')
    steps:
    - uses: actions/checkout@v4

    - name: Derive version and tag from the pushed ref (never from the run date)
      id: ver
      run: |
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          VERSION="${{ inputs.version }}"
          TAG="${VERSION}-pip-dlss"
        else
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG%-pip-dlss}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            echo "Tag '$TAG' must look like '<version>-pip-dlss'"; exit 1
          fi
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Download artifacts
      uses: actions/download-artifact@v4.1.8

    - name: Zip Exe folder
      run: |
        mkdir release_mt
        mkdir release_mt/bin
        mkdir release_mt/db
        mkdir release_mt/db/mods

        mv ${{env.PACK_GAMEDATA_NAME}}/*.db0 release_mt/db/mods

        mv ${{env.BUILD_CONFIG}}_mt_exe/*.exe release_mt/bin

        unzip ${{env.BUILD_CONFIG}}_mt_pdb/*.zip -d release_mt/bin

        cd release_mt
        zip -r 'STALKER-Anomaly-modded-exes-PiP-DLSS-MT_${{steps.ver.outputs.version}}.zip' ./*
        mv 'STALKER-Anomaly-modded-exes-PiP-DLSS-MT_${{steps.ver.outputs.version}}.zip' ../
        cd ..

    - name: Move PDBs to folder
      run: |
        mkdir pdb
        mv ${{env.BUILD_CONFIG}}_mt_pdb/*.zip 'pdb/STALKER-Anomaly-modded-exes-PiP-DLSS-MT_${{steps.ver.outputs.version}}_pdb.zip'

    - name: Pack GAMMA compatibility patch
      run: |
        cd extras/dlss_gamma
        zip -r '../../dlss-binaries-GAMMA-compatibility-patch-pip.zip' gamedata README.txt
        cd ../..

    - name: Pack XeSS binaries
      run: |
        curl -sSfL -o xess_sdk.zip https://github.com/intel/xess/releases/download/v3.0.2/XeSS_SDK_3.0.2.zip
        unzip xess_sdk.zip 'bin/*' -d xess_sdk
        mkdir xess-binaries
        cp xess_sdk/bin/libxess.dll xess_sdk/bin/libxess_dx11.dll xess-binaries/
        echo "Extract both DLLs beside AnomalyDX11AVX.exe to enable Intel XeSS upscaling (Intel GPUs only)." > xess-binaries/README.txt
        cd xess-binaries
        zip ../xess-binaries-pip.zip README.txt libxess.dll libxess_dx11.dll

    - name: Publish
      uses: softprops/action-gh-release@v2.3.2
      with:
        files: |
          *.zip
          pdb/*.zip
          extras/kmack-fixes/bodycam-kmack-terminal-fix.zip
        overwrite_files: true
        tag_name: "${{steps.ver.outputs.tag}}"
        name: "${{steps.ver.outputs.version}} DLSS/FSR3 MT + Immersive Bodycam"
        body: |
          ## Immersive Bodycam — What's Inside
          * X-Ray Monolith MT (upstream all-in-one-vs2022-wpo-mt, based on ${{steps.ver.outputs.version}}) with Shader Bus
          * **Immersive Bodycam** — true Picture-in-Picture weapon scopes plus bodycam-style weapon and camera movement, ported from [asuparabekon/xray-monolith-bodycam](https://github.com/asuparabekon/xray-monolith-bodycam/releases)
          * **Native DX11 DLSS / FSR 3.1 upscaling** (ported from [brodrigz/xray-monolith](https://github.com/brodrigz/xray-monolith/releases/tag/1.0.1) 1.0.1)
          * **Intel XeSS 3 super resolution** (XeSS SDK 3.0.2; Intel GPUs only)

          ## Build
          * DX11-AVX configuration
          * MT-TEST performance branch

          ## Upscaling requirements
          1. Install the bundled `dlss-binaries-GAMMA-compatibility-patch-pip.zip` as an MO2 mod with priority AFTER Screen Space Shaders / Atmospherics (it also ships inside `00_modded_exes_gamedata.db0`).
          2. Put NVIDIA's release `nvngx_dlss.dll` (from [brodrigz modded binaries](https://github.com/brodrigz/xray-monolith/releases) or [NVIDIA/DLSS v310.9.1](https://github.com/NVIDIA/DLSS/releases/tag/v310.9.1)) beside `AnomalyDX11AVX.exe`. For Intel XeSS: extract `xess-binaries-pip.zip` beside the exe instead (Intel GPUs only; DLSS/FSR 3 work without these DLLs).
          3. Turn TAA & MSAA Off, select FSR 3 / DLSS / XeSS in Video settings, Apply.

          ## bodycam-kmack-terminal-fix
          Fix for the GAMMA **[Kmack] Maxim PDX and Optics** package (only **GAMMA + 3DSS + Kmack PDX**).
          Enable it in MO2 **above** the `BODYCAM - PiP & 3DSS COMPATIBILITY PATCH` mod.
        token: "${{ secrets.GITHUB_TOKEN }}"

    - name: Remove artifacts
      uses: c-hive/gha-remove-artifacts@v1.2.0
      with:
        age: "1 second"
